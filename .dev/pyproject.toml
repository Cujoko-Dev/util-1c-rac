[build-system]
build-backend = "pdm.backend"
requires = ["pdm-backend"]

[project]
authors = [
    {name = "Cujoko", email = "cujoko@gmail.com"},
    {name = "George Kvelidze", email = "georgiykvelidze@gmail.com"},
]
classifiers=[
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Russian",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = [
    "loguru>=0.6.0",
    "pyyaml>=6.0",
]
description = "Utils for 1C:Enterprise Remote Administration Client"
license = {text = "MIT"}
name = "util-1c-rac"
requires-python = ">=3.10"
version = "0.1.0"

[project.urls]
repository = "https://github.com/Cujoko-Dev/util-1c-rac"

[tool.pdm.build]
package-dir = "../src"

[tool.pdm.dev-dependencies]
dev = [
    "-e file:///${PROJECT_ROOT}/../../commons-1c#egg=commons-1c",
    
    # Пакеты B
    "-e file:///${PROJECT_ROOT}/../../commons#egg=cjk-commons",
]

[tool.pdm.scripts]
test = "pytest"

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["../src"]
testpaths = ["../tests"]
