[build-system]
build-backend = "pdm.backend"
requires = ["pdm-backend"]

[project]
authors = [
    {name = "Cujoko", email = "cujoko@gmail.com"},
    {name = "George Kvelidze", email = "georgiykvelidze@gmail.com"},
]
classifiers=[
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Russian",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = [
    "loguru>=0.6.0",
    "pyyaml>=6.0",
]
description = "Utils for 1C:Enterprise Remote Administration Client"
dynamic = ["version"]
license = {text = "MIT"}
name = "util-1c-rac"
requires-python = ">=3.10"

[project.urls]
repository = "https://github.com/Cujoko-Dev/util-1c-rac"

[tool.pdm.build]
package-dir = "../src"

[tool.pdm.dev-dependencies]
dev = [
    "-e file:///${PROJECT_ROOT}/../../commons/.dev#egg=cjk-commons",
    "-e file:///${PROJECT_ROOT}/../../commons-1c/.dev#egg=commons-1c",
]

[tool.pdm.scripts]
test = { cmd = "pytest", working_dir = ".." }

[tool.pdm.version]
path = "../src/util_1c_rac/_version.py"
pattern = '^__version__\s*=\s*"([^"]+)"'
source = "file"
